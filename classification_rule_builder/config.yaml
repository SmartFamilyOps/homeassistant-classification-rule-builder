name: SmartFamilyOps Discovery Dashboard Builder
version: "0.6.1"
slug: classification_rule_builder
description: Build, preview, validate and publish deterministic Home Assistant device-classification rules.
url: https://github.com/SmartFamilyOps/homeassistant-classification-rule-builder
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
protected: true
ingress: true
ingress_port: 8099
panel_icon: mdi:format-list-checks
panel_title: Classification Rules
watchdog: http://[HOST]:8099/health
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  backup_limit: 20
schema:
  backup_limit: "int(1,100)"
