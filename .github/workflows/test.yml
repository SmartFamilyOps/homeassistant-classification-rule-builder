name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test rule builder
        working-directory: classification_rule_builder
        run: npm test
      - name: Check Home Assistant app repository files
        shell: bash
        run: |
          test -f repository.yaml
          test -f classification_rule_builder/config.yaml
          test -f classification_rule_builder/icon.png
          test -f classification_rule_builder/logo.png
